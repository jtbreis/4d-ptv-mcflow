# Build from repo root (Dockerfile COPY expects full tree).
# Run: docker compose run --rm tracking -- --case TTI_no_gravity
# Detached: docker compose run -d --rm tracking -- --case ...
# Env for mounts: OUTPUT_DIR (default: repo data/ via ../../data from this file).

services:
  tracking:
    build:
      context: ../..
      dockerfile: docker/tracking_all_runs/Dockerfile.tracking_all_runs
    image: ${IMAGE_NAME:-4d-ptv-tracking-all-runs}
    volumes:
      - type: bind
        source: ${OUTPUT_DIR:-../../data}
        target: /workspaces/4d-ptv-mcflow/data
